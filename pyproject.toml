[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-os-local"
version = "0.5.0"
description = "Local Markdown personal data and memory tools for MCP agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.12,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
personal-os = "personal_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_os = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
